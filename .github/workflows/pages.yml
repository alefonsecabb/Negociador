name: Publica o dashboard (GitHub Pages)

# Publica o conteudo de site/. Dois gatilhos:
# - push direto em site/** (ex. voce editando o dashboard manualmente).
# - workflow_run: commits feitos com o GITHUB_TOKEN de DENTRO de outra Action
#   (e o caso do monitor.yml, daily_cache.yml, on_execute.yml) NAO disparam
#   eventos "push" normais - e uma protecao do GitHub contra loop infinito
#   entre workflows. Por isso o deploy do Pages so acompanha essas execucoes
#   via workflow_run, que dispara ao final de outro workflow terminar,
#   independente de qual token commitou.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_run:
    workflows:
      - "Monitor ao vivo (sinais e alertas)"
      - "Atualiza cache historico (diario)"
      - "Reconcilia confirmacao de execucao"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
