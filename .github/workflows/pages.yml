name: Publica o dashboard (GitHub Pages)

# Publica o conteudo de site/ sempre que ele mudar - inclusive quando
# monitor.yml, daily_cache.yml ou on_execute.yml commitam novos JSONs em
# site/data/, para o dashboard sempre refletir a ultima execucao.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
